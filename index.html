<script>
const tabs=['home','intelligence','exposure','advisor','profile'];
const titles={home:'Home',intelligence:'Intelligence',exposure:'Exposure',advisor:'Advisor',profile:'Profile'};
function go(t){
  tabs.forEach(x=>{
    document.getElementById('s-'+x).classList.toggle('on',x===t);
    document.getElementById('n-'+x).classList.toggle('on',x===t);
  });
  document.getElementById('ptitle').textContent=titles[t];
}
function intel(el,key){
  document.querySelectorAll('#itabs .tab').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  ['fx','inf','rates','com'].forEach(k=>{
    document.getElementById('p-'+k).classList.toggle('on',k===key);
  });
}
const replies=[
  'Based on current conditions, I recommend reviewing your USD payment schedules. Forward cover from your bank could reduce exposure by up to 40%.',
  'Inflation at current levels is squeezing import-heavy businesses by an estimated 3–5% on operating margins. Would you like a full margin impact model?',
  'Fuel costs have risen 12% over the past quarter. If your logistics spend is above KSh 500K/month, this warrants immediate scenario planning.',
  'The CBK is expected to hold rates through Q3. Your variable-rate debt is relatively safe for now, but worth reviewing before Q4.'
];
let ri=0;
function sendMsg(){
  const inp=document.getElementById('chat-in');
  const v=inp.value.trim();
  if(!v)return;
  const msgs=document.getElementById('msgs');
  const u=document.createElement('div');
  u.className='msg u';u.textContent=v;msgs.appendChild(u);
  inp.value='';
  setTimeout(()=>{
    const r=document.createElement('div');
    r.className='msg';r.textContent=replies[ri%replies.length];ri++;
    msgs.appendChild(r);
    msgs.scrollTop=msgs.scrollHeight;
  },800);
}
<\/script>
</body>
</html>`;

document.getElementById('code-preview').textContent = html.slice(0, 800) + '\n\n… (' + html.length.toLocaleString() + ' characters total — click Copy to get the full file)';

function copyCode() {
  navigator.clipboard.writeText(html).then(() => {
    const btn = document.getElementById('cpbtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy full HTML'; btn.classList.remove('copied'); }, 2500);
  });
}
</script>
